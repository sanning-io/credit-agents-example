[project]
name = "credit-demo"
version = "0.1.0"
description = "Credit agents with a verifiable audit trail: an underwriting agent and a checker agent work one credit application under Sanning evidence, and an evidence builder builds the case file."
requires-python = ">=3.11"
dependencies = [
  # The SDK decides what recording, `bundle` and the case file hold and how
  # they are signed, so it is pinned to one version.
  "sanning-anchor[s3]==0.23.0",
  # The kernel that decides whether a case verifies, pinned for the same
  # reason. The tests and the README both run `sanning-proof case`.
  "sanning-proof==0.20.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "httpx>=0.27",
  "langchain>=1.4.0",
  "langchain-openai>=1.6.0",
  # Pinned: pypdf 6.20.0 joins a table cell's wrapped lines with no space
  # ("financed assetvalue"), so the policy's deposit table reads garbled.
  "pypdf==6.19.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  # The tests write sample PDFs with it.
  "fpdf2>=2.8",
]
# Renders the credit policy PDF from its HTML source (`policy/README.md`).
docs =["weasyprint>=69"]

[project.scripts]
credit-demo = "credit_demo.dev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A background thread that raises fails the run.
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
