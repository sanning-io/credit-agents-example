[project]
name = "credit-demo"
version = "0.1.0"
description = "Credit agents with a verifiable audit trail: an underwriting agent and a checker agent, as two services, working one credit application under Sanning evidence, and an evidence builder, a third service, that builds the case file."
requires-python = ">=3.11"
dependencies = [
  # Published packages only: the SDK is installed from PyPI as released.
  #
  # Pinned to one exact version, not a range: the SDK decides what recording,
  # `bundle` and the case file hold and how they are signed, so a resolver
  # free to move it is free to change what this example records and builds.
  "sanning-anchor[s3]==0.22.0",
  # Declared here rather than left to the anchor SDK, which verifies each
  # hand-off with it: the tests read every exported audit trail with
  # `sanning-proof case`, and the README tells a reader to do the same.
  # Pinned exactly for the same reason as the line above: this is the kernel
  # that decides whether a confirmation, and a case, verifies, so a resolver
  # free to move it is free to change what this example accepts.
  "sanning-proof==0.20.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "httpx>=0.27",
  # Both agents: LangChain drives the model and tools; OpenAI-compatible
  # `langchain-openai` speaks to OpenRouter; `pypdf` reads the two PDF case
  # documents with no system dependency.
  "langchain>=1.4.0",
  "langchain-openai>=1.6.0",
  # Pinned exactly: both agents read the credit policy as the PDF's
  # extracted text, and pypdf 6.20.0 joins a table cell's wrapped lines with
  # no space ("financed assetvalue", "seniorcredit officer"), so the policy's
  # deposit table reads garbled.
  "pypdf==6.19.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  # The publishing guard reads what a PDF says outside its pages; its test
  # writes sample PDFs with `fpdf2`.
  "fpdf2>=2.8",
]
# Rendering the credit policy PDF from its committed HTML source
# (`policy/README.md`). Not needed to run the example or its tests.
docs = ["weasyprint>=69"]

[project.scripts]
# The one command: starts both services locally, on a laptop, with no
# orchestration package.
credit-demo = "credit_demo.dev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A background thread that raises fails the run, instead of warning against
# whichever test happens to be running.
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
