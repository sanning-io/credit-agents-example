# The two agents as two services on one private network, both built from the
# one Dockerfile. `docker compose up` builds the image and starts both.
#
# Only the underwriter's port is published, and only on this machine's own
# address. The checker's endpoints take no credentials, so it has no published
# port: the underwriter reaches it by its service name on the compose network.
#
# Each service reads the settings in `.env` (shared) and in its own file
# (`underwriter.env`, `checker.env`). The README says how to make the three.

x-agent: &agent
  build: .
  image: credit-demo

services:
  underwriter:
    <<: *agent
    command: ["credit-demo", "underwriter"]
    env_file: [.env, underwriter.env]
    environment:
      CHECKER_URL: http://checker:8002
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - underwriter-runs:/app/runs
    depends_on:
      - checker

  checker:
    <<: *agent
    command: ["credit-demo", "checker"]
    env_file: [.env, checker.env]
    environment:
      DESK_URL: http://underwriter:8001
    volumes:
      - checker-runs:/app/runs

# The agent's cases and audit trail zips, kept across a restart. The records
# and their content are in Sanning and the log store.
volumes:
  underwriter-runs:
  checker-runs:
